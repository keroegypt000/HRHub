<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Ad Mas</title>
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,sans-serif;background:#f0faf6;color:#134e4a}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .logo{width:64px;height:64px;border-radius:16px;background:#059669;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
  .bar{width:180px;height:4px;background:#d1fae5;border-radius:4px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#059669;animation:m 1.2s infinite ease-in-out}
  @keyframes m{0%{margin-right:-40%}100%{margin-right:100%}}
  #msg{font-size:13px;color:#4b7a6f}
</style></head>
<body><div class="box"><div class="logo">AM</div><b>Ad Mas</b><div id="ver" style="font-size:12px;color:#4b7a6f"></div><div class="bar"><i></i></div><div id="msg">جارٍ تشغيل النظام وقاعدة البيانات...</div></div><script>var v=new URLSearchParams(location.search).get("v");if(v)document.getElementById("ver").textContent="الإصدار "+v;</script></body></html>
