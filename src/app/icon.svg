<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ADMS FOR HR MANAGMENT — علامة التطبيق: مربع دائري الزوايا بتدرج قطري + حرف A أبيض عريض + قوسا بصمة خافتان -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="113" fill="url(#bg)"/>

  <!-- قوسا بصمة خافتان خلف/أسفل الحرف -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <path d="M126 320 a130 130 0 0 1 260 0" stroke-opacity="0.14"/>
    <path d="M176 442 a80 80 0 0 1 160 0" stroke-opacity="0.20"/>
  </g>

  <!-- الحرف A — مرسوم بمسارات لضمان ثبات الشكل دون خطوط النظام -->
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 364 L256 148 L356 364"/>
    <path d="M190 290 L322 290"/>
  </g>
</svg>
